name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v

      - name: Regenerate sample captures
        run: python samples/generate_samples.py

      - name: Analyze every sample capture
        run: |
          mkdir -p reports
          for f in samples/*.pcap; do
            name=$(basename "$f" .pcap)
            python -m netcap_analyzer "$f" --md "reports/$name.md" --json "reports/$name.json"
            cat "reports/$name.md" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload reports
        uses: actions/upload-artifact@v5
        with:
          name: netcap-reports-py${{ matrix.python-version }}
          path: reports/
